repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^uv\.lock$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # The second rule ignores only SHA-256 content digests in the dashboard snapshot
        # (a known JSON key whose whole value is 64 hex characters); nothing else is exempt.
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-lines"
          - '^\s*"([a-z_]*(sha256|hash)|pulse\.(json|txt|md)|funnel\.json|analysis\.json)": "[0-9a-f]{64}",?$'
        exclude: (^uv\.lock$|^requirements.*\.txt$)
