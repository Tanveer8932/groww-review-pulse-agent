name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy

      # Same rules as the detect-secrets hook in .pre-commit-config.yaml; keep them in sync.
      # --exclude-lines ignores only SHA-256 content digests in the dashboard snapshot.
      - name: Secret scan
        run: |
          git ls-files -z | xargs -0 uv run --no-sync detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '(^uv\.lock$|^requirements.*\.txt$)' \
            --exclude-lines '^\s*"([a-z_]*(sha256|hash)|pulse\.(json|txt|md)|funnel\.json|analysis\.json)": "[0-9a-f]{64}",?$'

      - name: Tests
        run: uv run --no-sync pytest
        env:
          # Live tests (real MCP / LLM) never run in CI.
          RUN_LIVE_TESTS: "0"
